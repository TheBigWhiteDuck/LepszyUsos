{% extends 'base.html' %}
{% block title %}Usuń kurs | LepszyUSOS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h1 class="h5 text-danger mb-3">Potwierdź usunięcie kursu</h1>
                <p>Czy na pewno chcesz usunąć kurs <strong>{{ kurs.kod }} – {{ kurs.nazwa }}</strong>? Tej operacji nie można cofnąć.</p>
                <form method="post" class="d-flex gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Tak, usuń kurs</button>
                    <a href="{% url 'panel_prowadzacego' %}" class="btn btn-outline-secondary">Anuluj</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
